name: Autonomous PR Review & Approval Gate

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  autonomous-review:
    name: 4-Gate Autonomous Spec, Legal, Signature & OPSEC Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR Branch with Full History
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate 1 — OPSEC & Zero-PII Scan on Changed Files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "=== Gate 1: OPSEC & Zero-PII Scan ==="
          git fetch origin "${BASE_REF}" --depth=50
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -v '^.github/workflows/autonomous-pr-review.yml$' || true)
          if [ -z "${CHANGED_FILES}" ]; then
            echo "No changed files outside workflow definition."
            exit 0
          fi
          FORBIDDEN_REGEX='(BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|/Users/satori|hindsight|HINDSIGHT|192\.168\.10\.|100\.91\.|:9100|acid9burn|satori|munna|dachau|vierkirchen|85256|85221|48\.37|11\.50|elit3-x|elite-x|trackerIntake|aoagents)'
          for f in ${CHANGED_FILES}; do
            if [ -f "$f" ]; then
              if grep -nE "${FORBIDDEN_REGEX}" "$f"; then
                echo "::error file=$f::OPSEC/Zero-PII violation detected in $f"
                exit 1
              fi
            fi
          done
          echo "Gate 1 passed: Zero PII or secret patterns found in changed files."

      - name: Gate 2 — SSH Commit Signature & Author Verification
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "=== Gate 2: SSH Commit Signature Verification ==="
          COMMITS=$(git rev-list --no-merges "origin/${BASE_REF}..HEAD")
          if [ -z "${COMMITS}" ]; then
            echo "::error::No commits found in PR range origin/${BASE_REF}..HEAD"
            exit 1
          fi
          for sha in ${COMMITS}; do
            AUTHOR_EMAIL=$(git show -s --format='%ae' "${sha}")
            echo "Checking commit ${sha} (author: ${AUTHOR_EMAIL})..."
            if [ "${AUTHOR_EMAIL}" != "203040288+TinkeringDao@users.noreply.github.com" ]; then
              echo "::error::Commit ${sha} author email '${AUTHOR_EMAIL}' does not match required '203040288+TinkeringDao@users.noreply.github.com'"
              exit 1
            fi
            if ! git cat-file commit "${sha}" | grep -q '^gpgsig '; then
              echo "::error::Commit ${sha} is missing a cryptographic SSH/GPG signature"
              exit 1
            fi
          done
          echo "Gate 2 passed: All PR commits are authored by TinkeringDao and cryptographically signed."

      - name: Gate 3 — 8-Pillar Legal, German Addendum & Governance Verification
        run: |
          set -euo pipefail
          echo "=== Gate 3: Legal & Governance File Integrity ==="
          REQUIRED_FILES=(
            "LEGAL.md"
            "LICENSE"
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            ".github/CODEOWNERS"
            "AGENTS.md"
            "CLAUDE.md"
            "docs/agents/autonomous-pipeline.md"
          )
          for req in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "${req}" ]; then
              echo "::error::Required governance or spec file missing or empty: ${req}"
              exit 1
            fi
          done
          if ! grep -q "Addendum: German Statutory References" LEGAL.md; then
            echo "::error file=LEGAL.md::LEGAL.md is missing required 'Addendum: German Statutory References'"
            exit 1
          fi
          echo "Gate 3 passed: All required governance files and German Statutory Addendum verified."

      - name: Gate 4 — Project Configuration & Build Manifest Verification
        run: |
          set -euo pipefail
          echo "=== Gate 4: Project Configuration Verification ==="
          if [ ! -s "platformio.ini" ]; then
            echo "::error::platformio.ini is missing or empty"
            exit 1
          fi
          grep -q "\[env:" platformio.ini
          echo "Gate 4 passed: platformio.ini verified."

      - name: Post Automated Approval Review
        if: >-
          success() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == 'TinkeringDao'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BODY="### Automated Autonomous Pipeline Gate — APPROVED

          All 4 verification gates succeeded on commit \`${HEAD_SHA}\`:
          - **Gate 1 (OPSEC & Zero-PII Scan)**: Passed on all modified files.
          - **Gate 2 (Cryptographic SSH Commit Signatures)**: Verified \`TinkeringDao <203040288+TinkeringDao@users.noreply.github.com>\` signature on all PR commits.
          - **Gate 3 (8-Pillar Legal & Governance Check)**: Verified \`LEGAL.md\` (including \`Addendum: German Statutory References\`), \`LICENSE\`, \`SECURITY.md\`, \`CODE_OF_CONDUCT.md\`, \`.github/CODEOWNERS\`, \`AGENTS.md\`, \`CLAUDE.md\`, and \`docs/agents/autonomous-pipeline.md\`.
          - **Gate 4 (PlatformIO Configuration Integrity)**: Verified \`platformio.ini\` target environment definitions."
          gh pr review "${PR_NUMBER}" --approve --body "${BODY}"
